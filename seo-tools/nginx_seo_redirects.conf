# Enterprise SEO NGINX Configuration (Phase 6)
# Scalable Redirects, Soft 404 Prevention, and Faceted Navigation Control

server {
    listen 80;
    server_name www.example.com;

    # ==========================================
    # 1. SCALABLE REGEX 301 REDIRECTS
    # ==========================================
    # Migration Example: Moving from /category/product-123.html to /p/123
    # This single line handles MILLIONS of URLs instantly without hitting a database.
    rewrite ^/category/.*?-([0-9]+)\.html$ /p/$1 permanent;

    # Stripping trailing slashes (SEO canonical consistency)
    rewrite ^/(.*)/$ /$1 permanent;

    # Force Lowercase (Optional, usually requires Lua in NGINX, but shown as concept)
    # Keeping URLs strict prevents duplicate content issues.

    # ==========================================
    # 2. FACETED NAVIGATION CONTROL (E-commerce)
    # ==========================================
    # Block indexing of URLs with multiple filters to save crawl budget
    # E.g., ?color=red&size=large&brand=nike
    # We check if there are 2 or more '&' in the query string OR specific sorting parameters
    
    set $noindex_filters 0;
    
    # If query has sort or price parameters
    if ($arg_sort) { set $noindex_filters 1; }
    if ($arg_price_min) { set $noindex_filters 1; }
    
    # Or if query string is extremely long (multiple facets)
    if ($query_string ~ "(&.*){2,}") {
        set $noindex_filters 1;
    }

    if ($noindex_filters = 1) {
        # Inject X-Robots-Tag at the server level
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ==========================================
    # 3. SOFT 404 PREVENTION (True Deletion)
    # ==========================================
    # Instead of redirecting old, deleted products to the homepage (which Google hates),
    # we return a hard 410 Gone. This forces Googlebot to instantly drop the URL from the index.
    
    location ~ ^/discontinued-products/.*$ {
        return 410;
    }

    error_page 410 /410.html;
    location = /410.html {
        internal;
    }

    # Standard proxy pass to application (Next.js, Node, PHP)
    location / {
        proxy_pass http://localhost:3000;
        # Preserve original parameters
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
